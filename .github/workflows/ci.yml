name: muse2api server build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false # Never interrupt an active production deployment.

jobs:
  backend:
    name: Server synthetic regressions and Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install backend dependencies (no browser)
        run: python -m pip install -r requirements.txt
      - name: Guarded offline Python suite
        run: python tools/ci_backend.py
      - name: Synthetic admin JavaScript regressions
        run: |
          set -euo pipefail
          for test in tests/test_*.cjs tests/test_*.mjs; do
            node "$test"
          done
      - name: Build immutable server image (no startup)
        run: >-
          docker build --pull --tag muse2api-ci:check --file Dockerfile .
          --label org.opencontainers.image.revision="$GITHUB_SHA"
          --label org.muse2api.storage-contract=muse2api-storage-v1
      - name: Transfer and deploy tested image over pinned SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 15
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_SSH_MODE: ${{ vars.VPS_SSH_MODE }}
        run: |
          set -euo pipefail
          # BuildKit/containerd can expose a manifest-list ID before export while
          # the daemon that loads docker save identifies the imported image by
          # the single-platform manifest digest. Read that digest from the exact
          # archive we transfer so the remote identity check is portable.
          version=$(python -c 'import json; print(json.load(open("version.json"))["version"])')
          docker save --output deploy-image.tar muse2api-ci:check
          image_id=$(python - <<'PY'
          import json, tarfile
          with tarfile.open('deploy-image.tar', 'r') as archive:
              index = json.load(archive.extractfile('index.json'))
          manifests = index.get('manifests') or []
          if len(manifests) != 1:
              raise SystemExit('expected exactly one exported image manifest')
          digest = manifests[0].get('digest', '')
          if not digest.startswith('sha256:') or len(digest) != 71:
              raise SystemExit('invalid exported image manifest digest')
          print(digest)
          PY
          )
          bash tools/deploy_ssh.sh "$GITHUB_SHA" "$image_id" "$version"
