name: muse2api server build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Server synthetic regressions and Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install backend dependencies (no browser)
        run: python -m pip install -r requirements.txt
      - name: Guarded offline Python suite
        run: python tools/ci_backend.py
      - name: Synthetic admin JavaScript regressions
        run: |
          set -euo pipefail
          for test in tests/test_*.cjs tests/test_*.mjs; do
            node "$test"
          done
      - name: Build muse2api server image (no publish or startup)
        run: docker build --pull --tag muse2api-ci:check --file Dockerfile .
